<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bingo — Wakacyjny Challenge Sportowy</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 8px;
      }

      canvas {
        display: block;
        width: min(1200px, 100vw - 16px, calc(100dvh - 140px));
        height: auto;
        aspect-ratio: 1;
        touch-action: none;
        cursor: pointer;
        user-select: none;
      }

      #prizes {
        text-align: center;
        min-height: 2.75em;
      }

      .prizes-total {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: rgb(40, 157, 216);
      }

      .prizes-breakdown {
        margin: 4px 0 0;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.7);
        min-height: 1.2em;
      }

      button {
        appearance: none;
        background: transparent;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        padding: 10px 22px;
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.02em;
        cursor: pointer;
      }

      button:hover,
      button:focus-visible {
        border-color: #00e5ff;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="bingo" width="1200" height="1200"></canvas>
    <div id="prizes" aria-live="polite">
      <p class="prizes-total">Masz 0 losów</p>
      <p class="prizes-breakdown"></p>
    </div>
    <button type="button" id="reset">Resetuj kartę</button>

    <script>
      const CANVAS_SIZE = 1200;
      const GRID = {
        left: 108,
        top: 112,
        right: 116,
        gutter: 8,
        cols: 4,
        rows: 4,
        cell: 238,
      };

      const CYAN = "#00e5ff";
      const MAGENTA = "#e040fb";
      const LINE_COLOR = "rgb(40, 157, 216)";
      const CHECKER_EVEN_COLOR = "rgb(22, 118, 170)";
      const CHECKER_ODD_COLOR = "rgb(12, 150, 155)";

      function lineCombos() {
        const combos = [];
        for (let row = 0; row < GRID.rows; row++) {
          combos.push({
            id: `row-${row}`,
            type: "line",
            cells: Array.from({ length: GRID.cols }, (_, col) => row * GRID.cols + col),
            prizes: 1,
          });
        }
        for (let col = 0; col < GRID.cols; col++) {
          combos.push({
            id: `col-${col}`,
            type: "line",
            cells: Array.from({ length: GRID.rows }, (_, row) => row * GRID.cols + col),
            prizes: 1,
          });
        }
        combos.push({
          id: "diag-main",
          type: "line",
          cells: [0, 5, 10, 15],
          prizes: 1,
        });
        combos.push({
          id: "diag-anti",
          type: "line",
          cells: [3, 6, 9, 12],
          prizes: 1,
        });
        return combos;
      }

      const COMBINATIONS = [
        ...lineCombos(),
        {
          id: "checker-even",
          type: "checker",
          cells: [0, 2, 5, 7, 8, 10, 13, 15],
          prizes: 2,
          color: CHECKER_EVEN_COLOR,
        },
        {
          id: "checker-odd",
          type: "checker",
          cells: [1, 3, 4, 6, 9, 11, 12, 14],
          prizes: 2,
          color: CHECKER_ODD_COLOR,
        },
        {
          id: "bingo",
          type: "full",
          cells: Array.from({ length: GRID.cols * GRID.rows }, (_, index) => index),
          prizes: 4,
        },
      ];

      function cellRect(index) {
        const col = index % GRID.cols;
        const row = Math.floor(index / GRID.cols);
        const step = GRID.cell + GRID.gutter;
        return {
          x: GRID.left + col * step,
          y: GRID.top + row * step,
          size: GRID.cell,
        };
      }

      function cellCenter(index) {
        const { x, y, size } = cellRect(index);
        return { x: x + size / 2, y: y + size / 2 };
      }

      function cellAt(x, y) {
        const count = GRID.cols * GRID.rows;
        for (let i = 0; i < count; i++) {
          const { x: cx, y: cy, size } = cellRect(i);
          if (x >= cx && x < cx + size && y >= cy && y < cy + size) {
            return i;
          }
        }
        return -1;
      }

      function loadSelected(storageKey) {
        const count = GRID.cols * GRID.rows;
        try {
          const raw = JSON.parse(localStorage.getItem(storageKey));
          if (
            Array.isArray(raw) &&
            raw.length === count &&
            raw.every((value) => typeof value === "boolean")
          ) {
            return raw;
          }
        } catch {
          /* ignore invalid storage */
        }
        return Array(count).fill(false);
      }

      function matchCombinations(selected, combinations) {
        return combinations.filter((combo) =>
          combo.cells.every((index) => selected[index])
        );
      }

      function polishPlural(n, one, few, many) {
        if (n === 1) return one;
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
        return many;
      }

      function prizeBreakdown(matches) {
        const lines = matches.filter((combo) => combo.type === "line").length;
        const checkers = matches.filter((combo) => combo.type === "checker").length;
        const full = matches.some((combo) => combo.type === "full");
        const parts = [];
        if (lines) {
          parts.push(`${lines} ${polishPlural(lines, "linia", "linie", "linii")}`);
        }
        if (checkers) {
          parts.push(
            checkers === 1
              ? "szachownica"
              : `2 ${polishPlural(2, "szachownica", "szachownice", "szachownic")}`
          );
        }
        if (full) parts.push("Bingo");
        return parts.join(" · ");
      }

      function updatePrizeLabel(prizeEl, total, matches) {
        if (!prizeEl) return;
        const totalEl = prizeEl.querySelector(".prizes-total");
        const breakdownEl = prizeEl.querySelector(".prizes-breakdown");
        const word = polishPlural(total, "los", "losy", "losów");
        if (totalEl) totalEl.textContent = `Masz ${total} ${word}`;
        if (breakdownEl) {
          breakdownEl.textContent = total > 0 ? prizeBreakdown(matches) : "";
        }
      }

      function cellGradient(ctx, x, y, size) {
        const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
        gradient.addColorStop(0, CYAN);
        gradient.addColorStop(1, MAGENTA);
        return gradient;
      }

      function paintFor(ctx, value, x, y, size) {
        if (!value || value === "cyan-magenta") {
          return cellGradient(ctx, x, y, size);
        }
        return value;
      }

      function drawCellOverlay(
        ctx,
        index,
        { fill, border, fillAlpha, lineWidth, lineDash, inset = 0 }
      ) {
        const { x, y, size } = cellRect(index);
        const ox = x + inset;
        const oy = y + inset;
        const os = size - inset * 2;
        if (fill) {
          ctx.save();
          ctx.globalAlpha = fillAlpha ?? 0.5;
          ctx.fillStyle = paintFor(ctx, fill, ox, oy, os);
          ctx.fillRect(ox, oy, os, os);
          ctx.restore();
        }
        if (border) {
          const stroke = lineWidth ?? 6;
          ctx.save();
          ctx.strokeStyle = paintFor(ctx, border, ox, oy, os);
          ctx.lineWidth = stroke;
          if (lineDash) ctx.setLineDash(lineDash);
          ctx.strokeRect(
            ox + stroke / 2,
            oy + stroke / 2,
            os - stroke,
            os - stroke
          );
          ctx.restore();
        }
      }

      function drawLineHighlight(ctx, cells) {
        const points = cells.map(cellCenter);
        ctx.save();
        ctx.strokeStyle = LINE_COLOR;
        ctx.lineWidth = 16;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.stroke();
        ctx.restore();

        cells.forEach((index) => {
          drawCellOverlay(ctx, index, {
            border: LINE_COLOR,
            lineWidth: 8,
          });
        });
      }

      function drawCheckerFill(ctx, cells, color) {
        cells.forEach((index) => {
          drawCellOverlay(ctx, index, {
            fill: color,
            fillAlpha: 0.35,
          });
        });
      }

      function drawCheckerBorder(ctx, cells, color) {
        cells.forEach((index) => {
          drawCellOverlay(ctx, index, {
            border: color,
            lineWidth: 8,
            lineDash: [22, 14],
            inset: 12,
          });
        });
      }

      function drawFullHighlight(ctx, pulse = 0) {
        const gridSize = GRID.cols * GRID.cell + (GRID.cols - 1) * GRID.gutter;
        const pad = 12 + pulse * 16;
        const x = GRID.left - pad;
        const y = GRID.top - pad;
        const size = gridSize + pad * 2;
        const radius = 24;
        const gradient = cellGradient(ctx, x, y, size);

        if (pulse > 0) {
          const ringPad = 12 + pulse * 36;
          const rx = GRID.left - ringPad;
          const ry = GRID.top - ringPad;
          const rs = gridSize + ringPad * 2;
          ctx.save();
          ctx.globalAlpha = (1 - pulse) * 0.9;
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 6 + pulse * 8;
          ctx.beginPath();
          ctx.roundRect(rx, ry, rs, rs, radius + pulse * 8);
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, radius);

        ctx.shadowColor = CYAN;
        ctx.shadowBlur = 32 + pulse * 48;
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 18 + pulse * 10;
        ctx.stroke();

        ctx.shadowBlur = 0;
        ctx.lineWidth = 8;
        ctx.stroke();

        ctx.restore();
      }

      function drawBingoBurst(ctx, pulse) {
        const scale = 0.72 + pulse * 0.55;
        ctx.save();
        ctx.globalAlpha = 0.72 + pulse * 0.28;
        ctx.translate(CANVAS_SIZE / 2, CANVAS_SIZE / 2);
        ctx.scale(scale, scale);
        ctx.font = "900 140px system-ui, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = MAGENTA;
        ctx.shadowBlur = 28;
        ctx.fillStyle = cellGradient(ctx, -280, -80, 560);
        ctx.fillText("BINGO!", 0, 0);
        ctx.restore();
      }

      function drawCombinationHighlights(ctx, matches, pulse = 0) {
        const checkers = matches.filter((combo) => combo.type === "checker");
        checkers.forEach((combo) =>
          drawCheckerFill(ctx, combo.cells, combo.color)
        );
        matches
          .filter((combo) => combo.type === "line")
          .forEach((combo) => drawLineHighlight(ctx, combo.cells));
        checkers.forEach((combo) =>
          drawCheckerBorder(ctx, combo.cells, combo.color)
        );
        if (matches.some((combo) => combo.type === "full")) {
          drawFullHighlight(ctx, pulse);
          drawBingoBurst(ctx, pulse);
        }
      }

      function createBoard({
        canvas,
        storageKey,
        combinations = [],
        resetButton,
        prizeEl,
      }) {
        const ctx = canvas.getContext("2d");
        const selected = loadSelected(storageKey);
        let background = null;
        let bingoPulse = 0;
        let pulseRaf = 0;
        const reduceMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        function hasBingo() {
          return matchCombinations(selected, combinations).some(
            (combo) => combo.type === "full"
          );
        }

        function stopBingoPulse() {
          if (pulseRaf) cancelAnimationFrame(pulseRaf);
          pulseRaf = 0;
          bingoPulse = 0;
        }

        function startBingoPulse() {
          if (reduceMotion) {
            bingoPulse = 1;
            redraw();
            return;
          }
          if (pulseRaf) cancelAnimationFrame(pulseRaf);
          const period = 900;
          const start = performance.now();
          function tick(now) {
            const t = ((now - start) / period) % 1;
            bingoPulse = Math.sin(t * Math.PI);
            redraw();
            pulseRaf = requestAnimationFrame(tick);
          }
          pulseRaf = requestAnimationFrame(tick);
        }

        function save() {
          localStorage.setItem(storageKey, JSON.stringify(selected));
        }

        function redraw() {
          ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

          if (background) {
            ctx.drawImage(background, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
          }

          selected.forEach((isOn, index) => {
            if (!isOn) return;
            drawCellOverlay(ctx, index, {
              fill: "cyan-magenta",
              border: "cyan-magenta",
              fillAlpha: 0.5,
              lineWidth: 6,
            });
          });

          const matches = matchCombinations(selected, combinations);
          drawCombinationHighlights(ctx, matches, bingoPulse);
          updatePrizeLabel(
            prizeEl,
            matches.reduce((sum, combo) => sum + (combo.prizes || 0), 0),
            matches
          );
        }

        function reset() {
          stopBingoPulse();
          selected.fill(false);
          save();
          redraw();
        }

        function pointerToCanvas(event) {
          const rect = canvas.getBoundingClientRect();
          const scaleX = CANVAS_SIZE / rect.width;
          const scaleY = CANVAS_SIZE / rect.height;
          return {
            x: (event.clientX - rect.left) * scaleX,
            y: (event.clientY - rect.top) * scaleY,
          };
        }

        canvas.addEventListener("pointerdown", (event) => {
          const { x, y } = pointerToCanvas(event);
          const index = cellAt(x, y);
          if (index < 0) return;
          const beforeBingo = hasBingo();
          selected[index] = !selected[index];
          save();
          const afterBingo = hasBingo();
          if (afterBingo && !beforeBingo) {
            startBingoPulse();
            return;
          }
          if (!afterBingo) stopBingoPulse();
          redraw();
        });

        if (resetButton) {
          resetButton.addEventListener("click", () => {
            if (!window.confirm("Czy na pewno chcesz zresetować kartę?")) {
              return;
            }
            reset();
          });
        }

        const image = new Image();
        image.onload = () => {
          background = image;
          redraw();
        };
        image.onerror = () => redraw();
        image.src = "bingo_ig.png";

        redraw();
        if (hasBingo()) startBingoPulse();

        return {
          reset,
          getSelected: () => selected.slice(),
          redraw,
        };
      }

      createBoard({
        canvas: document.getElementById("bingo"),
        storageKey: "bingo-ig-selected",
        combinations: COMBINATIONS,
        resetButton: document.getElementById("reset"),
        prizeEl: document.getElementById("prizes"),
      });
    </script>
  </body>
</html>
